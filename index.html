<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNOODY — 顔玉パズル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101726;color:#ecf3ff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(100%,560px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:23px;margin:0;letter-spacing:.04em}small{color:#93a6c4;font-size:11px;letter-spacing:.13em}.stats{display:flex;gap:20px}.stats div{font-size:11px;color:#93a6c4}.stats b{display:block;font-size:23px;color:#fff;font-variant-numeric:tabular-nums}.board{position:relative;border:1px solid #364661;border-radius:20px;overflow:hidden;background:#172339;box-shadow:0 20px 70px #0005;cursor:none}.board .overlay,.board .overlay button{cursor:auto}canvas{display:block;width:100%;touch-action:none}button{border:0;border-radius:10px;padding:12px 18px;background:#93edc5;color:#132b27;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.1)}footer{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:14px}p{font-size:12px;color:#a9b9d0;line-height:1.8;margin:0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1424c9;backdrop-filter:blur(7px);text-align:center}.overlay[hidden]{display:none}.overlay h2{font-size:34px;margin:0 0 10px}.overlay p{margin-bottom:24px}.hint{margin-top:12px;text-align:center;color:#7e94b4;font-size:11px}button:focus-visible{outline:3px solid white;outline-offset:3px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}#sound{background:#30445e;color:#e5edff;font-size:12px;padding:12px}#sound[aria-pressed="false"]{color:#a9b9d0}@media(max-width:420px){footer{align-items:flex-start}.controls{max-width:130px}}
</style>
</head>
<body><main>
<header><div><small>A LITTLE FACE-MATCHING GAME</small><h1>SNOODY</h1></div><div class="stats"><div>LEVEL<b id="level">1</b></div><div>SCORE<b id="score">0</b></div><div>BEST<b id="best">0</b></div></div></header>
<div class="board"><canvas id="game" width="520" height="680" aria-label="SNOODY。マウスまたは左右キーで狙い、クリックまたはスペースキーで発射。" tabindex="0"></canvas><div class="overlay" id="overlay" hidden><div><small id="resultLabel">WELL PLAYED</small><h2 id="result"></h2><p id="summary"></p><button id="again">もう一度あそぶ</button></div></div></div>
<footer><p>同じ顔を<strong>3つ以上</strong>つなげて消そう。<br>天井から切り離すと、まとめて落下！</p><div class="controls"><button id="sound" aria-pressed="true" aria-label="効果音を切り替え">♪ 効果音 ON</button><button id="restart">リスタート</button></div></footer><div class="hint">マウス: クリックで発射 · スマホ: ドラッグして狙い、指を離して発射<br>← → で照準 · Spaceで発射（スマホはタップだけでは発射しません）<br>消せないショットが<span id="timing">5</span>回たまると天井が1段下がります<br>クリアで次のレベルへ。天井が下がる間隔は5→4→3→2回に短縮<br>5発ごとに爆弾（B）が登場！ 3つ以上つなげると爆発し、周囲の顔も壊します</div>
</main><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=520,H=680,R=26,D=52,DY=Math.sqrt(3)*R,COLS=9,OX=39,OY=38,LAUNCH={x:260,y:614},LIMIT=553;

// Sound is synthesized locally; initialize only after a user gesture.
let audioContext,masterGain,soundOn=true;
try{soundOn=localStorage.getItem('facePuzzleSound')!=='off'}catch(e){}
const soundButton=document.getElementById('sound');
function soundUI(){soundButton.textContent=soundOn?'♪ 効果音 ON':'♪ 効果音 OFF';soundButton.setAttribute('aria-pressed',String(soundOn))}
function unlockAudio(){
 if(!soundOn)return;
 try{if(!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext=new Audio();masterGain=audioContext.createGain();masterGain.gain.value=.22;masterGain.connect(audioContext.destination)}
 if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
 }catch(e){}
}
function tone(frequency,end,duration,delay=0,volume=.5,wave='sine'){
 if(!soundOn||!audioContext||!masterGain||audioContext.state!=='running')return;
 try{const start=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=wave;o.frequency.setValueAtTime(frequency,start);o.frequency.exponentialRampToValueAtTime(end,start+duration);g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(volume,start+.008);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g);g.connect(masterGain);o.start(start);o.stop(start+duration+.02);o.onended=()=>{o.disconnect();g.disconnect()}}catch(e){}
}
function sfx(event){
 if(event==='bomb'){tone(95,28,.5,0,.9,'sawtooth');tone(180,40,.35,0,.6,'triangle')}
 if(event==='fire')tone(260,820,.13,0,.45,'triangle');
 if(event==='bounce')tone(850,520,.07,0,.25);
 if(event==='land')tone(230,125,.1,0,.4,'triangle');
 if(event==='match')[660,880,1100].forEach((f,i)=>tone(f,f*1.08,.16,i*.045,.45));
 if(event==='drop'){tone(1100,220,.48,.12,.35,'triangle');[1320,1660].forEach((f,i)=>tone(f,f,.22,.18+i*.09,.25))}
 if(event==='ceiling'){tone(180,130,.2,0,.45,'triangle');tone(150,100,.25,.22,.45,'triangle')}
 if(event==='win')[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.32,.3+i*.12,.45,'triangle'));
 if(event==='lost')[392,330,262,196].forEach((f,i)=>tone(f,f*.94,.3,.15+i*.16,.4,'triangle'));
}
canvas.addEventListener('pointerdown',unlockAudio);
canvas.addEventListener('keydown',unlockAudio);
soundButton.onclick=()=>{soundOn=!soundOn;soundUI();try{localStorage.setItem('facePuzzleSound',soundOn?'on':'off')}catch(e){}if(masterGain)masterGain.gain.setValueAtTime(soundOn?.22:0,audioContext.currentTime);if(soundOn){unlockAudio();sfx('bounce')}};
soundUI();

// Palette chosen with color-vision differences in mind.
const colors=['#E69F00','#56B4E9','#F0E442','#009E73','#CC79A7'];
let level=1;
const missLimit=()=>Math.max(2,6-level);
let shotNumber=1;
let grid,shot,particles,score,best=0,misses,ceiling,ceilingTarget,current,next,angle=-Math.PI/2,state,last=0,clearFx=0,gameOverFx=0,fx=[],scorePops=[],shake=0,flash=0;
try{best=Number(localStorage.getItem('facePuzzleBest'))||0}catch(e){}
document.getElementById('best').textContent=best;
const pos=(r,c)=>({x:OX+c*D+(r%2)*R,y:OY+r*DY+ceiling});
function neighbors(r,c){return [[r,c-1],[r,c+1],[r-1,c+(r%2?0:-1)],[r-1,c+(r%2?1:0)],[r+1,c+(r%2?0:-1)],[r+1,c+(r%2?1:0)]].filter(([a,b])=>a>=0&&b>=0&&b<COLS)}
function available(){return [...new Set([...grid.values()].map(v=>v.type).filter(type=>type>=0))]}
function choose(){let a=available();return a.length?a[Math.floor(Math.random()*a.length)]:0}
function hud(){document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('facePuzzleBest',best)}catch(e){}}}
function reset(advance=false){if(advance===true)level++;else{level=1;score=0}document.getElementById('level').textContent=level;document.getElementById('timing').textContent=missLimit();shotNumber=1;grid=new Map();ceiling=0;ceilingTarget=0;for(let r=0;r<4;r++)for(let c=0;c<COLS;c++)grid.set(r+','+c,{r,c,type:Math.floor(Math.random()*5)});particles=[];fx=[];scorePops=[];shot=null;misses=0;clearFx=0;gameOverFx=0;shake=0;flash=0;angle=-Math.PI/2;state='play';current=choose();next=choose();hud();document.getElementById('overlay').hidden=true}
function showResult(win,reason=''){state=win?'win':'lost';document.getElementById('resultLabel').textContent=win?'ALL CLEAR':reason==='limit'?'LIMIT REACHED':'TRY AGAIN';document.getElementById('result').textContent=win?'ステージ '+level+' クリア！':'ゲームオーバー';document.getElementById('again').textContent=win?'次のステージへ':'最初からあそぶ';document.getElementById('summary').textContent=reason==='limit'?'天井がLIMITまで到達しました · スコア '+score+' · ベスト '+best:'スコア '+score+' · ベスト '+best;document.getElementById('overlay').hidden=false}
function finish(win,reason=''){if(win){if(state==='clearFx')return;clearFx=1.2;state='clearFx';impactFx(W/2,290,'#d8fff0',2.4);scorePops.push({text:'CLEAR!',x:W/2,y:245,life:1.1,max:1.1,color:'#d8fff0'});sfx('win');return}if(reason==='limit'){if(state==='gameOverFx')return;gameOverFx=1.15;state='gameOverFx';impactFx(W/2,LIMIT,'#ff5c6b',2.2);sfx('lost');return}sfx('lost');showResult(false,reason)}
function burst(v,drop){let p=pos(v.r,v.c);particles.push({...p,type:v.type,vx:(Math.random()-.5)*180,vy:drop?50:-140,life:drop?1.25:.5,max:drop?1.25:.5,drop})}
function impactFx(x,y,color='#93edc5',power=1,shakePower=0){fx.push({kind:'ring',x,y,life:.62,max:.62,size:18,color});const count=Math.round(10+power*8);for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,speed=70+Math.random()*170*power;fx.push({kind:'spark',x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:.45+Math.random()*.35,max:.8,color,size:2+Math.random()*3})}shake=Math.max(shake,shakePower*4);flash=Math.max(flash,power*.12)}
function component(start,predicate){let seen=new Set([start]),queue=[start];for(let i=0;i<queue.length;i++){let v=grid.get(queue[i]);for(let [r,c]of neighbors(v.r,v.c)){let k=r+','+c,n=grid.get(k);if(n&&!seen.has(k)&&predicate(n)){seen.add(k);queue.push(k)}}}return seen}
function settle(){let options=[];for(let c=0;c<COLS;c++)if(!grid.has('0,'+c))options.push([0,c]);for(let v of grid.values())for(let [r,c]of neighbors(v.r,v.c))if(!grid.has(r+','+c))options.push([r,c]);options=options.filter(([r,c])=>{let p=pos(r,c);return Math.hypot(p.x-shot.x,p.y-shot.y)<D*1.6});options.sort((a,b)=>{let p=pos(...a),q=pos(...b);return Math.hypot(p.x-shot.x,p.y-shot.y)-Math.hypot(q.x-shot.x,q.y-shot.y)});if(!options.length){shot=null;finish(false,'blocked');return}let [r,c]=options[0],key=r+','+c,type=shot.type;grid.set(key,{r,c,type});shot=null;let isBomb=type===-1,hit=pos(r,c);let group=component(key,v=>v.type===type);if(group.size>=3){ 
if(isBomb){
 const bombs=[...group].map(k=>grid.get(k));
 for(const bomb of bombs){const center=pos(bomb.r,bomb.c);particles.push({...center,type:-2,vx:0,vy:0,life:.45,max:.45,drop:false});for(const [k,v] of grid){const p=pos(v.r,v.c);if(v.type!==-1&&Math.hypot(p.x-center.x,p.y-center.y)<=D*2.1)group.add(k)}}
}
sfx(isBomb?'bomb':'match');impactFx(hit.x,hit.y,isBomb?'#ffd275':'#93edc5',isBomb?2.2:1,isBomb?2.2:1);for(let k of group){burst(grid.get(k),false);grid.delete(k)}score+=group.size*10;let anchored=new Set(),queue=[];for(let [k,v]of grid)if(v.r===0){anchored.add(k);queue.push(k)}for(let i=0;i<queue.length;i++){let v=grid.get(queue[i]);for(let [a,b]of neighbors(v.r,v.c)){let k=a+','+b;if(grid.has(k)&&!anchored.has(k)){anchored.add(k);queue.push(k)}}}let dropped=0;for(let [k,v]of grid)if(!anchored.has(k)){dropped++;burst(v,true);grid.delete(k);score+=25}if(dropped){impactFx(hit.x,hit.y,'#ffd275',1.15);scorePops.push({text:'+'+(group.size*10+dropped*25),x:hit.x,y:hit.y-34,life:.95,max:.95,color:'#ffd275'});sfx('drop')}else scorePops.push({text:'+'+(group.size*10),x:hit.x,y:hit.y-34,life:.75,max:.75,color:'#d8fff0'});hud()}else{sfx('land');impactFx(hit.x,hit.y,'#9baac2',.35);misses++;if(misses>=missLimit()){misses=0;ceilingTarget+=DY;impactFx(W/2,ceilingTarget,'#ff819c',1.4);sfx('ceiling')}}if(![...grid.values()].some(v=>v.type!==-1)){finish(true);return}for(let v of grid.values())if(pos(v.r,v.c).y+R>=LIMIT){finish(false,'limit');return}shotNumber++;let a=available();current=next===-1?-1:(a.includes(next)?next:choose());next=(shotNumber+1)%5===0?-1:choose()}
function fire(){if(state!=='play'||shot)return;sfx('fire');shot={x:LAUNCH.x,y:LAUNCH.y,vx:Math.cos(angle)*690,vy:Math.sin(angle)*690,type:current}}
function aim(e){let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;angle=Math.max(-Math.PI+.15,Math.min(-.15,Math.atan2(y-LAUNCH.y,x-LAUNCH.x)))}
let pointerActive=false,activePointerType='',touchMoved=false,touchStartX=0,touchStartY=0;
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&!pointerActive)return;aim(e);if(activePointerType==='touch'&&Math.hypot(e.clientX-touchStartX,e.clientY-touchStartY)>24)touchMoved=true});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus();pointerActive=true;activePointerType=e.pointerType||'mouse';touchStartX=e.clientX;touchStartY=e.clientY;touchMoved=false;try{canvas.setPointerCapture(e.pointerId)}catch(err){}aim(e);if(activePointerType!=='touch')fire()});
canvas.addEventListener('pointerup',e=>{e.preventDefault();if(activePointerType==='touch'&&touchMoved)fire();pointerActive=false;activePointerType='';touchMoved=false});
canvas.addEventListener('pointercancel',()=>{pointerActive=false;activePointerType='';touchMoved=false});
canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key===' ')fire();else angle=Math.max(-Math.PI+.15,Math.min(-.15,angle+(e.key==='ArrowLeft'?-.065:.065)))}});
document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=()=>{reset(state==='win');canvas.focus()};

function face(x,y,type,scale=1,alpha=1){scale*=1.3;
if(type===-2){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#ffd275';ctx.lineWidth=5*alpha;ctx.beginPath();ctx.arc(x,y,20+(1-alpha)*D*2.1,0,Math.PI*2);ctx.stroke();ctx.restore();return}
if(type===-1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.globalAlpha=alpha;
ctx.strokeStyle='#ffd275';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(7,-13);ctx.quadraticCurveTo(7,-25,15,-22);ctx.stroke();
ctx.fillStyle='#ffe99b';ctx.beginPath();ctx.arc(15,-22,3,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#273044';ctx.strokeStyle='#f5d494';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,1,17,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#ffffff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('B',0,2);
ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.ellipse(-6,-7,5,3,-.5,0,Math.PI*2);ctx.fill();ctx.restore();return}
ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.globalAlpha=alpha;ctx.fillStyle='#0003';ctx.beginPath();ctx.arc(0,3,19,0,Math.PI*2);ctx.fill();ctx.fillStyle=colors[type];ctx.beginPath();ctx.roundRect(-18,-18,36,36,12);ctx.fill();ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.ellipse(-5,-12,8,3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#27304c';if(type===1){for(let x of [-7,7]){ctx.beginPath();ctx.arc(x,-3,3,Math.PI,0);ctx.lineWidth=2;ctx.strokeStyle='#27304c';ctx.stroke()}}else{ctx.beginPath();ctx.ellipse(-7,-3,2.7,type===4?4.8:3.6,0,0,7);ctx.ellipse(7,-3,2.7,type===4?4.8:3.6,0,0,7);ctx.fill()}ctx.strokeStyle='#27304c';ctx.lineWidth=2;ctx.beginPath();if(type===2){ctx.arc(0,7,3,0,7)}else{ctx.arc(0,4,type===3?4:6,0,Math.PI)}ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(sx,sy);ctx.fillStyle='#172339';ctx.fillRect(-20,-20,W+40,H+40);ctx.fillStyle='#24324a';for(let y=16;y<H;y+=24)for(let x=16;x<W;x+=24){ctx.beginPath();ctx.arc(x,y,1,0,7);ctx.fill()}ctx.save();ctx.beginPath();ctx.rect(18,0,484,ceiling+10);ctx.clip();
ctx.fillStyle='#263044';ctx.fillRect(18,0,484,ceiling+10);
const brickH=18,brickW=48;
for(let row=0;row*brickH<ceiling+10;row++){
 for(let col=-1;col<12;col++){
  const bx=18+col*brickW+(row%2)*brickW/2,by=row*brickH;
  ctx.fillStyle=(row+col)%3===0?'#ae7164':'#986052';ctx.beginPath();ctx.roundRect(bx+1,by+1,brickW-3,brickH-3,2);ctx.fill();
  ctx.fillStyle='#e2a18a66';ctx.fillRect(bx+4,by+2,brickW-9,2);
 }
}
ctx.restore();ctx.fillStyle='#201c2b66';ctx.fillRect(18,ceiling+8,484,2);ctx.strokeStyle='#ff819c66';ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(20,LIMIT);ctx.lineTo(500,LIMIT);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9baac2';ctx.font='10px system-ui';ctx.fillText('LIMIT',23,LIMIT+15);
if(state==='play'&&!shot){
 ctx.save();ctx.translate(LAUNCH.x,LAUNCH.y);ctx.rotate(angle);ctx.translate(7,0);
 // A plump, rounded arrow shows direction without predicting the trajectory.
 ctx.shadowColor='#00000040';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
 ctx.fillStyle='#93edc5';ctx.strokeStyle='#d8fff0';ctx.lineWidth=2.5;ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(41,-6);ctx.lineTo(69,-6);ctx.lineTo(69,-13);
 ctx.quadraticCurveTo(69,-18,74,-15);ctx.lineTo(94,-3);
 ctx.quadraticCurveTo(99,0,94,3);ctx.lineTo(74,15);
 ctx.quadraticCurveTo(69,18,69,13);ctx.lineTo(69,6);ctx.lineTo(41,6);
 ctx.quadraticCurveTo(35,6,35,0);ctx.quadraticCurveTo(35,-6,41,-6);
 ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.strokeStyle='#ffffff90';ctx.lineWidth=2;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(43,-2);ctx.lineTo(62,-2);ctx.stroke();ctx.restore();
}
for(let v of grid.values()){let p=pos(v.r,v.c);face(p.x,p.y,v.type)}for(let p of particles)face(p.x,p.y,p.type,p.drop?1:.5+.5*p.life/p.max,Math.max(0,p.life/p.max));ctx.strokeStyle='#425675';ctx.lineWidth=5;ctx.beginPath();ctx.arc(LAUNCH.x,LAUNCH.y,34,0,7);ctx.stroke();ctx.lineWidth=1;if(!shot)face(LAUNCH.x,LAUNCH.y,current);else face(shot.x,shot.y,shot.type);face(421,615,next,.72);ctx.fillStyle='#a9b9d0';ctx.font='10px system-ui';ctx.fillText('NEXT',407,650);ctx.fillText('天井が降りてくるまで',38,601);for(let i=0;i<missLimit();i++){ctx.fillStyle=i<misses?'#ff819c':'#3f526d';ctx.beginPath();ctx.arc(43+i*15,619,4,0,7);ctx.fill()}
for(let f of fx){const t=1-f.life/f.max;if(f.kind==='ring'){ctx.save();ctx.globalAlpha=Math.max(0,1-t);ctx.strokeStyle=f.color;ctx.lineWidth=5*(1-t)+1;ctx.beginPath();ctx.arc(f.x,f.y,f.size+t*72,0,Math.PI*2);ctx.stroke();ctx.restore()}else{ctx.save();ctx.globalAlpha=Math.max(0,1-t);ctx.fillStyle=f.color;ctx.translate(f.x,f.y);ctx.rotate(t*4);ctx.fillRect(-f.size/2,-f.size*1.8,f.size,f.size*3.6);ctx.restore()}}
for(let p of scorePops){ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.font='800 20px system-ui';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y-(1-p.life/p.max)*34);ctx.restore()}
if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(18,0,484,H)}
if(state==='clearFx'){const progress=1-clearFx/1.2,fade=Math.min(1,progress*2);ctx.save();ctx.fillStyle='rgba(147,237,197,'+(0.08+fade*.16)+')';ctx.fillRect(18,0,484,H);ctx.translate(W/2,290);for(let i=0;i<3;i++){ctx.strokeStyle='rgba(216,255,240,'+(1-progress)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,45+progress*210+i*22,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#d8fff0';ctx.font='800 34px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=Math.min(1,fade*1.4);ctx.fillText('STAGE CLEAR!',0,0);ctx.font='700 14px system-ui';ctx.fillStyle='#ffffff';ctx.fillText('次のステージへ',0,34);ctx.restore()}
if(state==='gameOverFx'){const progress=1-gameOverFx/1.15,pulse=.5+.5*Math.sin(progress*Math.PI*8);ctx.save();ctx.fillStyle='rgba(255,92,107,'+(0.08+pulse*.15)+')';ctx.fillRect(18,0,484,H);ctx.strokeStyle='#ff5c6b';ctx.lineWidth=4+pulse*3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(20,LIMIT);ctx.lineTo(500,LIMIT);ctx.stroke();ctx.setLineDash([]);ctx.translate(W/2,290);ctx.fillStyle='#ffe6e9';ctx.font='800 32px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.75+progress*.25;ctx.fillText('LIMIT REACHED',0,0);ctx.font='700 15px system-ui';ctx.fillStyle='#ffffff';ctx.fillText('天井がLIMITまで到達しました',0,35);ctx.restore()}
ctx.restore()}
function tick(t){let dt=Math.min((t-last)/1000,.035);last=t;const ceilingGap=ceilingTarget-ceiling;if(Math.abs(ceilingGap)>.05){ceiling+=ceilingGap*Math.min(1,dt*8);if(Math.abs(ceilingTarget-ceiling)<.05)ceiling=ceilingTarget}if(state==='play'&&ceilingTarget>0){for(let v of grid.values())if(pos(v.r,v.c).y+R>=LIMIT){finish(false,'limit');break}}if(state==='clearFx'){clearFx-=dt;if(clearFx<=0){clearFx=0;showResult(true)}}if(state==='gameOverFx'){gameOverFx-=dt;if(gameOverFx<=0){gameOverFx=0;showResult(false,'limit')}}if(shot&&state==='play'){let steps=Math.ceil(dt*690/7);for(let i=0;i<steps&&shot;i++){shot.x+=shot.vx*dt/steps;shot.y+=shot.vy*dt/steps;if(shot.x<R){shot.x=2*R-shot.x;shot.vx=Math.abs(shot.vx);impactFx(shot.x,shot.y,'#d8fff0',.35);sfx('bounce')}if(shot.x>W-R){shot.x=2*(W-R)-shot.x;shot.vx=-Math.abs(shot.vx);impactFx(shot.x,shot.y,'#d8fff0',.35);sfx('bounce')}if(shot.y<=OY+ceiling||[...grid.values()].some(v=>{let p=pos(v.r,v.c);return Math.hypot(p.x-shot.x,p.y-shot.y)<D-1}))settle()}}for(let p of particles){p.life-=dt;p.vy+=650*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);for(let f of fx){f.life-=dt;if(f.kind==='spark'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=260*dt}}fx=fx.filter(f=>f.life>0);for(let p of scorePops)p.life-=dt;scorePops=scorePops.filter(p=>p.life>0);shake=Math.max(0,shake-dt*48);flash=Math.max(0,flash-dt*.8);draw();requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></body></html>
